<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BEASTRIA</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>🦁 BEASTRIA</h1>


<div id="game">


<!-- プレイヤー情報 -->
<section id="status">

<h2>プレイヤー</h2>

<p>HP:
<span id="playerHP"></span>
</p>

<p>攻撃:
<span id="playerATK"></span>
</p>

<p>属性:
<span id="playerType"></span>
</p>

</section>



<!-- メイン画面 -->

<section id="main">

<h2 id="title">
ビースト選択
</h2>


<div id="beastList"></div>


<div id="battleArea" hidden>

<h2>⚔️ バトル</h2>


<img id="enemyImg">


<h3 id="enemyName"></h3>


<p>
敵HP
<span id="enemyHP"></span>
</p>


<button id="attackButton">
攻撃
</button>


</div>


</section>


</div>


<script src="js/data.js"></script>
<script src="js/player.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>


</body>
</html>
