<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テスト</title>
</head>
<body style="margin:0; background:#ffcc00; color:#000; font-size:24px; padding:24px; font-family:sans-serif;">

<p>①これが見えていれば、HTML+CSSの表示自体は正常です。</p>

<p id="js-result">②まだJSは実行されていません</p>

<script>
  document.getElementById('js-result').textContent = '②JSも正常に動いています!';
  document.getElementById('js-result').style.color = 'green';
</script>

<script type="module">
  document.body.insertAdjacentHTML('beforeend', '<p style="color:blue;">③ES Modules(type="module")も正常に動いています!</p>');
</script>

</body>
</html>
